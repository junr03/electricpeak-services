name: Substack Digest
on:
  pull_request:
    paths: ['services/substack-digest/**', 'scripts/**', 'flake.*', '.github/workflows/substack-digest.yml']
  push:
    branches: [main, 'jnr/**']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  image:
    runs-on: ubuntu-latest
    outputs:
      digest: ${{ steps.publish.outputs.digest }}
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build candidate
        uses: docker/build-push-action@v6
        with:
          context: services/substack-digest
          load: true
          platforms: linux/amd64
          tags: substack-digest:test
      - name: Install PDF validation tools
        run: sudo apt-get update && sudo apt-get install -y poppler-utils
      - name: Test container against isolated fixture data
        run: scripts/smoke-substack-digest.sh substack-digest:test
      - name: Log into GHCR for trusted branch publication
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish revision-addressed candidate
        if: github.event_name != 'pull_request'
        id: publish
        uses: docker/build-push-action@v6
        with:
          context: services/substack-digest
          push: true
          platforms: linux/amd64
          tags: ghcr.io/junr03/electricpeak-services/substack-digest:sha-${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/junr03/electricpeak-services
            org.opencontainers.image.revision=${{ github.sha }}
      - name: Record immutable image reference
        if: github.event_name != 'pull_request'
        env:
          DIGEST: ${{ steps.publish.outputs.digest }}
        run: echo "ghcr.io/junr03/electricpeak-services/substack-digest@$DIGEST" >> "$GITHUB_STEP_SUMMARY"
  public-pull:
    if: github.event_name != 'pull_request'
    needs: [image]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install PDF validation tools
        run: sudo apt-get update && sudo apt-get install -y poppler-utils
      - name: Pull published image anonymously and test it
        env:
          DIGEST: ${{ needs.image.outputs.digest }}
        run: |
          export DOCKER_CONFIG
          DOCKER_CONFIG=$(mktemp -d)
          image="ghcr.io/junr03/electricpeak-services/substack-digest@$DIGEST"
          docker pull --platform linux/amd64 "$image"
          scripts/smoke-substack-digest.sh "$image"
