name: OpenDashboards
on:
  pull_request:
    paths: ['services/opendashboards/**', 'scripts/smoke-opendashboards*.sh', '.github/workflows/opendashboards.yml']
  push:
    branches: [main, 'jnr/**']
    paths: ['services/opendashboards/**', 'scripts/smoke-opendashboards*.sh', '.github/workflows/opendashboards.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  image:
    runs-on: ubuntu-latest
    outputs:
      digest: ${{ steps.publish.outputs.digest }}
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build and test production adapters
        uses: docker/build-push-action@v6
        with:
          context: services/opendashboards
          load: true
          platforms: linux/amd64
          tags: opendashboards:test
      - name: Smoke-test with an isolated PostgreSQL database
        run: bash scripts/smoke-opendashboards.sh opendashboards:test
      - name: Test operator-authorized TLS data sources
        run: |
          docker build --target build -t opendashboards:source-tests services/opendashboards
          bash scripts/smoke-opendashboards-private-source.sh opendashboards:source-tests
      - name: Log into GHCR for trusted branch publication
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish revision-addressed image
        if: github.event_name != 'pull_request'
        id: publish
        uses: docker/build-push-action@v6
        with:
          context: services/opendashboards
          push: true
          platforms: linux/amd64
          tags: ghcr.io/junr03/electricpeak-services/opendashboards:sha-${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/junr03/electricpeak-services
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.licenses=MIT
      - name: Record immutable image reference
        if: github.event_name != 'pull_request'
        env:
          DIGEST: ${{ steps.publish.outputs.digest }}
        run: echo "ghcr.io/junr03/electricpeak-services/opendashboards@$DIGEST" >> "$GITHUB_STEP_SUMMARY"
  public-pull:
    if: github.event_name != 'pull_request'
    needs: image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Pull published image anonymously and test it
        env:
          DIGEST: ${{ needs.image.outputs.digest }}
        run: |
          export DOCKER_CONFIG
          DOCKER_CONFIG=$(mktemp -d)
          image="ghcr.io/junr03/electricpeak-services/opendashboards@$DIGEST"
          docker pull --platform linux/amd64 "$image"
          bash scripts/smoke-opendashboards.sh "$image"
