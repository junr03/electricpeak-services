name: transaction-import

services:
  db:
    image: postgres:17-alpine@sha256:f9cf3e1f0066f0eb0c48707d864f0ac5941e9ff454a072077d97a4d278d07d73
    environment:
      POSTGRES_DB: transactions
      POSTGRES_USER: transactions
      POSTGRES_PASSWORD_FILE: /run/secrets/database-password
    secrets:
      - database-password
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U transactions -d transactions"]
      interval: 2s
      timeout: 5s
      retries: 30
    networks: [database]
    restart: unless-stopped
    security_opt: ["no-new-privileges:true"]

  importer:
    build: .
    image: transaction-import:local
    profiles: [import]
    # Compose mounts retain host ownership; match the owner of the secret file.
    user: "${IMPORT_UID:-1000}:${IMPORT_GID:-100}"
    environment:
      PGHOST: db
      PGDATABASE: transactions
      PGUSER: transactions
      PGPASSWORD_FILE: /run/secrets/database-password
    secrets:
      - database-password
    depends_on:
      db:
        condition: service_healthy
    networks: [database]
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    stdin_open: true
    restart: "no"

networks:
  database:
    internal: true

volumes:
  postgres-data:

secrets:
  database-password:
    file: ${POSTGRES_PASSWORD_FILE:-./secrets/database-password}
