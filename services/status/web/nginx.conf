# Static status page. The host-side collector writes status.json; this
# container has no Docker socket, no host network, and no write access to it.
server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    add_header Cache-Control "no-store" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Content-Security-Policy "default-src 'none'; script-src 'self'; style-src 'self'; connect-src 'self'; base-uri 'none'; frame-ancestors 'none'" always;

    location = /data/status.json {
        alias /srv/status-data/status.json;
        default_type application/json;
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
