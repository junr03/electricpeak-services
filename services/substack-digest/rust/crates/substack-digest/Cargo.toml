[package]
name = "substack-digest"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version = "1.88" # Minimum required by the locked HTTP/cookie dependencies.

[dependencies]
anyhow = "1"
base64 = "0.22"
chrono = { version = "0.4", features = ["serde"] }
chrono-tz = { version = "0.10", features = ["serde"] }
fs2 = "0.4"
headless_chrome = "=1.0.22"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "cookies", "rustls-tls"] }
serde.workspace = true
serde_json.workspace = true
sha2 = "0.10"
tempfile = "3"
url = "2"

[lints]
workspace = true
